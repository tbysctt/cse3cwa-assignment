services:
  db:
    image: postgres:16-alpine
    container_name: phoneme-activity-builder-db
    environment:
      POSTGRES_USER: phoneme-activity-builder
      POSTGRES_PASSWORD: cse3cwa
      POSTGRES_DB: phoneme-activity-builder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U phoneme-activity-builder -d phoneme-activity-builder",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: phoneme-activity-builder-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: phoneme-activity-builder-otel-lgtm
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/phoneme-activity-builder.json
    ports:
      - "3001:3000" # Grafana UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./docker/grafana/dashboards/phoneme-activity-builder.json:/otel-lgtm/grafana/conf/provisioning/dashboards/custom/phoneme-activity-builder.json:ro
      - ./docker/grafana/dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: phoneme-activity-builder-alloy
    command:
      - run
      - /etc/alloy-config/config.alloy
      - --storage.path=/var/lib/alloy/data
    ports:
      - "12347:12347" # Faro /collect
    # Mount the directory (not a single file) — Docker Desktop often turns
    # file bind-mounts into directories and breaks Alloy startup.
    volumes:
      - ./docker/alloy:/etc/alloy-config:ro
    depends_on:
      - otel-lgtm
    restart: unless-stopped

  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FARO_URL: http://localhost:12347/collect
        NEXT_PUBLIC_FARO_APP_NAME: phoneme-activity-builder-web
        NEXT_PUBLIC_FARO_APP_NAMESPACE: phoneme-activity-builder
    container_name: nextjs-app
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - DATABASE_URL=postgresql://phoneme-activity-builder:cse3cwa@db:5432/phoneme-activity-builder
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_SERVICE_NAME=phoneme-activity-builder
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=phoneme-activity-builder,service.instance.id=phoneme-activity-builder-1
      - OTEL_METRIC_EXPORT_INTERVAL=5000
      - NEXT_PUBLIC_FARO_URL=http://localhost:12347/collect
      - NEXT_PUBLIC_FARO_APP_NAME=phoneme-activity-builder-web
      - NEXT_PUBLIC_FARO_APP_NAMESPACE=phoneme-activity-builder
    depends_on:
      db:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
      alloy:
        condition: service_started
    restart: unless-stopped

  # Hits /health so app.health.check.* counters keep increasing and OTLP-push to Grafana.
  health-prober:
    image: curlimages/curl:8.12.1
    container_name: phoneme-activity-builder-health-prober
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          curl -sf "http://nextjs-app:3000/health" || true
          sleep 10
        done
    depends_on:
      - nextjs-app
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin_data:
